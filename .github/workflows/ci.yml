name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: jobradar_test
          POSTGRES_USER: jobradar
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobradar -d jobradar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://jobradar:ci_only_password@localhost:5432/jobradar_test
      TEST_DATABASE_URL: postgresql+psycopg://jobradar:ci_only_password@localhost:5432/jobradar_test

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python and locked dependencies
        run: |
          uv python install 3.13
          uv sync --frozen --extra dev

      - name: Run static checks
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src/jobradar
          uv run bandit -q -r src/jobradar
          bash -n scripts/backup_postgres.sh scripts/verify_postgres_backup.sh scripts/cleanup_build_cache.sh

      - name: Audit Python dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --output-file requirements-audit.txt
          uv run pip-audit --strict --requirement requirements-audit.txt

      - name: Audit development dependencies
        run: |
          uv export --frozen --extra dev --no-emit-project --output-file requirements-audit-dev.txt
          uv run pip-audit --strict --requirement requirements-audit-dev.txt

      - name: Verify migrations
        run: uv run alembic upgrade head

      - name: Verify PostgreSQL backup restoration
        run: |
          initial_volumes="$(docker volume ls --quiet | sort)"
          backup_file="$(mktemp --suffix=.dump)"
          trap 'rm -f "$backup_file"' EXIT
          docker run --rm --network host --env PGPASSWORD=ci_only_password \
            postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73 \
            psql --host=localhost --username=jobradar --dbname=jobradar_test \
            --set ON_ERROR_STOP=1 \
            --command "INSERT INTO sources (name, display_name, opportunity_kind, enabled, failure_alert_active, coverage_alert_active, request_budget, created_at, updated_at) VALUES ('restore-fixture', 'Restore Fixture', 'employment', true, false, false, '{}'::jsonb, now(), now())" \
            --command "WITH restored_opportunity AS (INSERT INTO opportunities (kind, status, canonical_key, title, work_mode, first_seen_at, last_seen_at, created_at, updated_at) VALUES ('employment', 'active', 'restore-fixture', 'Restore fixture', 'remote', now(), now(), now(), now()) RETURNING id) INSERT INTO listings (source_id, opportunity_id, external_id, source_url, canonical_url, content_hash, raw_data, quality_score, first_seen_at, last_seen_at, is_active, created_at, updated_at) SELECT sources.id, restored_opportunity.id, 'restore-1', 'https://example.invalid/restore-1', 'https://example.invalid/restore-1', 'fixture-hash', '{}'::jsonb, 0, now(), now(), true, now(), now() FROM sources CROSS JOIN restored_opportunity WHERE sources.name = 'restore-fixture'"
          docker run --rm --network host --env PGPASSWORD=ci_only_password \
            postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73 \
            pg_dump --host=localhost --username=jobradar --dbname=jobradar_test \
            --format=custom --compress=6 >"$backup_file"
          restore_output="$(bash scripts/verify_postgres_backup.sh "$backup_file")"
          printf '%s\n' "$restore_output"
          grep -Fxq 'sources=1' <<<"$restore_output"
          grep -Fxq 'opportunities=1' <<<"$restore_output"
          grep -Fxq 'listings=1' <<<"$restore_output"
          if [[ "$(docker volume ls --quiet | sort)" != "$initial_volumes" ]]; then
            printf 'Successful restore check left an unexpected Docker volume.\n' >&2
            exit 1
          fi
          printf 'not a PostgreSQL archive' >"$backup_file"
          if bash scripts/verify_postgres_backup.sh "$backup_file"; then
            printf 'Corrupt backup was accepted.\n' >&2
            exit 1
          fi
          if [[ "$(docker volume ls --quiet | sort)" != "$initial_volumes" ]]; then
            printf 'Failed restore check left an unexpected Docker volume.\n' >&2
            exit 1
          fi

      - name: Run tests
        run: uv run python -m pytest

      - name: Build and verify attested runtime image
        run: |
          image_archive="${RUNNER_TEMP}/jobradar-runtime.oci.tar"
          docker buildx create --name jobradar-ci --driver docker-container --use
          docker buildx build --builder jobradar-ci --target runtime \
            --provenance=mode=min --sbom=true \
            --output "type=oci,dest=${image_archive}" .
          python scripts/verify_image_attestations.py "${image_archive}"

      - name: Scan Git history for secrets
        run: >-
          docker run --rm
          --volume "${PWD}:/repo"
          zricethezav/gitleaks:v8.30.0@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner
