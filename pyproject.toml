[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jobradar"
version = "1.3.0"
description = "A private job and freelance opportunity aggregator"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.19.1,<2.0",
    "fastapi>=0.141.1,<0.142",
    "httpx>=0.28.1,<0.29",
    "psycopg[binary]>=3.3.4,<4.0",
    "pydantic-settings>=2.15.0,<3.0",
    "pyyaml>=6.0.2,<7.0",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "structlog>=26.1.0,<27.0",
    "uvicorn[standard]>=0.52.4,<0.53",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.21,<1.0",
    "mypy>=2.3.1,<2.4",
    "pytest>=9.1.1,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "ruff>=0.16.4,<0.17",
    "types-pyyaml>=6.0.12.20250915,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require PostgreSQL",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tmp", ".venv*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
packages = ["jobradar"]
